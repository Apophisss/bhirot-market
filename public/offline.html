<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>אין חיבור · בחירות מרקט</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: "Heebo", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        background: #ffffff; color: #1c2b45; text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; color: #0a1020; }
      p { font-size: 0.9rem; line-height: 1.6; color: #4f6182; margin: 0 0 1.25rem; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
        padding: 0 1.5rem; border-radius: 12px; background: #1d4ed8; color: #fff;
        font-weight: 700; text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1020; color: #dbe4f4; }
        h1 { color: #f4f8ff; }
        p { color: #a8b6d0; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" width="56" height="56" />
      <h1>אין חיבור לרשת</h1>
      <p>
        המחירים בבחירות מרקט משתנים כל הזמן, ולכן אנחנו לא שומרים אותם לצפייה במצב לא־מקוון — מחיר ישן גרוע ממחיר חסר.
        ברגע שהחיבור יחזור, הכול ימשיך מהמקום שבו היה.
      </p>
      <a href="/">לנסות שוב</a>
    </main>
  </body>
</html>
